  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500">
    <rect x="355" y="218" width="186" height="36" rx="18" fill="#0f172a" stroke="#24354f" stroke-width="1"/>
    <text x="448" y="241" text-anchor="middle" fill="#e2e8f0">任意代理主秘书</text>

    <rect x="555" y="218" width="186" height="36" rx="18" fill="#0f172a" stroke="#24354f" stroke-width="1"/>
    <text x="648" y="241" text-anchor="middle" fill="#e2e8f0">360° 液态玻璃</text>

    <rect x="755" y="218" width="186" height="36" rx="18" fill="#0f172a" stroke="#24354f" stroke-width="1"/>
    <text x="848" y="241" text-anchor="middle" fill="#e2e8f0">单文件混合记忆</text>

    <rect x="955" y="218" width="205" height="36" rx="18" fill="#0f172a" stroke="#24354f" stroke-width="1"/>
    <text x="1057.5" y="241" text-anchor="middle" fill="#e2e8f0">四大可选独立插件</text>
  </g>

  <text x="355" y="286" fill="#64748b" font-size="12" letter-spacing="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Tauri v2 · React 19 · WebWallGL · SQLite WAL + FTS5 + sqlite-vec · Cordis · Magpie Vault</text>
</svg>
