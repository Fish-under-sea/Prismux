<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hzd-title hzd-desc">
  <title id="hzd-title">Prismux — 极简液态玻璃 AI 超级工作台与 24h 秘书系统</title>
  <desc id="hzd-desc">Prismux 深色主题主视觉横幅</desc>
  <defs>
    <linearGradient id="hzd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b13"/>
      <stop offset="55%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#090f1b"/>
    </linearGradient>
    <radialGradient id="hzd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hzd-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6cb6ff" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#6cb6ff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6cb6ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hzd-facet-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="hzd-facet-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="hzd-facet-c" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6cb6ff" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="hzd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.48"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#hzd-bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#hzd-grid)"/>
  <line x1="60" y1="3" x2="1140" y2="3" stroke="url(#hzd-rim)" stroke-width="1.5"/>

  <!-- Fresnel Ambient & Concentric Orbit -->
  <circle cx="195" cy="160" r="148" fill="url(#hzd-glow)"/>
  <circle cx="195" cy="160" r="112" fill="none" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="195" cy="160" r="88" fill="none" stroke="#6cb6ff" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Geometric Fresnel Prism Mark -->
  <g transform="translate(195,160)">
    <polygon points="0,-70 60,-20 40,56 -40,56 -60,-20" fill="#0f172a" fill-opacity="0.72" stroke="#6cb6ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <polygon points="0,-70 60,-20 0,8 -60,-20" fill="url(#hzd-facet-c)" stroke="#bae6fd" stroke-opacity="0.65" stroke-width="1"/>
    <polygon points="-60,-20 0,8 -40,56" fill="url(#hzd-facet-a)" stroke="#6cb6ff" stroke-opacity="0.55" stroke-width="1"/>
    <polygon points="60,-20 40,56 0,8" fill="url(#hzd-facet-b)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <polygon points="-40,56 0,8 40,56" fill="#0f172a" fill-opacity="0.62" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="0" cy="8" r="5" fill="#e0f2fe" fill-opacity="0.95"/>
    <path d="M 64 -52 L 66 -44 L 74 -42 L 66 -40 L 64 -32 L 62 -40 L 54 -42 L 62 -44 Z" fill="#6cb6ff" fill-opacity="0.88"/>
  </g>

  <!-- Right Typography Column -->
  <rect x="355" y="48" width="420" height="28" rx="14" fill="#0f1b2e" stroke="#253b5e" stroke-width="1"/>
  <circle cx="373" cy="62" r="4" fill="#38bdf8"/>
  <text x="387" y="66.5" fill="#93c5fd" font-size="12.5" font-weight="600" letter-spacing="0.8" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">24H 无头守护中枢 · 0-TOKEN 液态玻璃工作台</text>

  <text x="355" y="138" fill="#f8fafc" font-size="56" font-weight="700" letter-spacing="7" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">PRISMUX</text>
  <line x1="355" y1="154" x2="720" y2="154" stroke="url(#hzd-rim)" stroke-width="1.5"/>

  <text x="355" y="186" fill="#cbd5e1" font-size="21" font-weight="500" letter-spacing="0.4" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">极简液态玻璃 AI 超级工作台 · 24 小时常驻秘书系统</text>

