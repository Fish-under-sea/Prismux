name: Publish Official Plugins to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.1-alpha.1; defaults to current ref)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-npm-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 with GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@fish-under-sea"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages and official plugins
        run: pnpm -r build

      - name: Pack deterministic .wb-plugin archives
        run: |
          for id in qq pet fishdock-hook ssh; do
            node scripts/pack-plugin.ts --plugin "plugins-official/plugin-${id}" --out ".work/release-out"
          done

      - name: Generate scriptless GitHub Packages npm bundles (@fish-under-sea)
        run: >
          node scripts/build-npm-plugin-packages.ts
          --dir ".work/release-out"
          --out ".work/npm-packages"
          --scope "@fish-under-sea"

      - name: Publish @fish-under-sea/prismux-plugin-* packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_TAG=$(node -e "
            const v = String(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version || '');
            const idx = v.indexOf('-');
            if (idx === -1) { console.log('latest'); }
            else {
              const seg = v.slice(idx + 1).split('.')[0] || '';
              const alpha = seg.match(/^[A-Za-z]+/);
              console.log(alpha ? alpha[0].toLowerCase() : 'prerelease');
            }
          ")
          echo "Resolved npm dist-tag: ${DIST_TAG}"
          for id in qq pet fishdock-hook ssh; do
            PKG_DIR=".work/npm-packages/${id}"
            PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${PKG_DIR}/package.json', 'utf8')).name)")
            PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${PKG_DIR}/package.json', 'utf8')).version)")
            if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Skip ${PKG_NAME}@${PKG_VERSION}: already published on GitHub Packages."
              continue
            fi
            (cd "${PKG_DIR}" && npm publish --tag "${DIST_TAG}" --registry=https://npm.pkg.github.com)
          done
